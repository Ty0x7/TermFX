<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TermFX Studio</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=20261020" />
  <link rel="stylesheet" href="styles.css?v=20261022b" />
</head>
<body>
  <div id="app-container">
    <!-- Minimal Top Header Bar -->
    <header id="titlebar">
      <div class="title-left">
        <span class="brand-badge">TERMFX</span>
        <div id="phase-buttons" title="Press SPACE or keys 1-4 to advance stage"></div>
        <span id="ai-status-pill" class="status-pill">READY</span>
      </div>
      <div class="title-controls">
        <button id="btn-clean-view" class="warn-btn" title="Hide sidebar & top bar for recording (Hotkey: TAB or F1)">[TAB] Clean View</button>
        <button id="btn-720p" title="1280x720 (16:9)">720p</button>
        <button id="btn-1080p" title="1920x1080 (16:9)">1080p</button>
        <button id="btn-min" title="Minimize">─</button>
        <button id="btn-max" title="Maximize">□</button>
        <button id="btn-close" class="danger-btn" title="Close">✕</button>
      </div>
    </header>

    <!-- Main Workspace: Left Sidebar + 3D ASCII Terminal Viewport -->
    <div id="workspace-body">
      <aside id="sidebar">
        <div class="sidebar-section scenes-section">
          <div class="sidebar-label-row">
            <span class="sidebar-label" id="scene-count-label">SCENES</span>
            <div class="scene-step-btns">
              <button id="btn-prev-scene" title="Previous Scene (Hotkey: [)">◄</button>
              <button id="btn-next-scene" title="Next Scene (Hotkey: ])">►</button>
            </div>
          </div>
          <div id="quick-scene-buttons" class="sidebar-btn-list"></div>
          <select id="preset-select" title="Saved & Built-in Scenes" style="margin-top:4px; width:100%"></select>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-label">PLAYBACK</div>
          <div class="sidebar-row">
            <button id="btn-autotype" class="primary-btn" style="flex:1" title="Auto-type prompt on screen (F2)">🎬 Type [F2]</button>
            <button id="btn-restart" title="Reset to Stage 1 (R)">↺ [R]</button>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-label">VISUAL FX</div>
          <select id="theme-select" style="width:100%">
            <option value="cyberblue" selected>J.A.R.V.I.S. Cyber Blue</option>
            <option value="jarvisgold">Stark Mark-85 (Blue/Gold)</option>
            <option value="cyberpunk">Cyberpunk Neon</option>
            <option value="clean">Clean Modern Blue</option>
            <option value="amber">Amber CRT</option>
            <option value="redalert">Combat Override (Red)</option>
            <option value="matrix">Matrix Green</option>
          </select>
          <div class="fx-grid">
            <button id="btn-holo-hud" class="active" data-fx="holoHud" title="Anti-aliased hologram vector overlay">Holo</button>
            <button id="btn-glow" class="active" data-fx="crtGlow" title="Multi-pass bloom">Bloom</button>
            <button id="btn-scanlines" class="active" data-fx="scanlines" title="CRT scanlines + refresh band">Scan</button>
            <button class="active" data-fx="subpixel" title="Sub-pixel glyph motion (smooth gliding)">Smooth</button>
            <button class="active" data-fx="cameraMotion" title="Camera push-in, drift & stage punches">Cam</button>
            <button class="active" data-fx="textReveal" title="Type-on text reveal">Type</button>
            <button class="active" data-fx="grain" title="Film grain (prevents YouTube banding)">Grain</button>
            <button class="active" data-fx="vignette" title="Lens vignette">Vign</button>
            <button class="active" data-fx="bgGrid" title="Parallax dot grid background">Grid</button>
            <button class="active" data-fx="transitionFx" title="Stage-change scan sweep & punch">Trans</button>
            <button class="active" data-fx="introFx" title="CRT power-on when a scene starts">Intro</button>
            <button class="active" data-fx="showTimeline" title="Bottom stage timeline bar">Bar</button>
          </div>
          <div class="sidebar-row" style="margin-top:4px">
            <label class="mini-label" for="cfg-stage-seconds">Stage sec</label>
            <input id="cfg-stage-seconds" title="Stage length. Narrated scenes: 4.6 = narration pace (higher = slower)" type="number" min="1.5" max="30" step="0.1" value="4.6" style="width:58px" />
            <button id="btn-pause" style="flex:1" title="Pause / resume (P). Step one frame with . while paused">❚❚ [P]</button>
          </div>
        </div>

        <div class="sidebar-section">
          <div class="sidebar-label">OUTPUT</div>
          <div class="sidebar-row">
            <select id="output-select" style="flex:1" title="Stage resolution (preview is always 16:9 except Fit)">
              <option value="fit">Fit Window</option>
              <option value="720p">720p</option>
              <option value="1080p" selected>1080p</option>
              <option value="1440p">1440p</option>
              <option value="4k">4K UHD</option>
            </select>
            <select id="fps-select" style="width:58px" title="Render frame rate">
              <option value="60" selected>60</option>
              <option value="30">30</option>
              <option value="24">24</option>
            </select>
          </div>
          <select id="bg-select" style="width:100%" title="Background for exports">
            <option value="theme" selected>Theme Background</option>
            <option value="black">Pure Black (Screen/Add blend)</option>
            <option value="alpha">Transparent (ProRes / PNG)</option>
          </select>
          <select id="format-select" style="width:100%" title="Render format">
            <option value="mp4" selected>MP4 · H.264 (CRF 12)</option>
            <option value="prores">MOV · ProRes 4444 + Alpha</option>
            <option value="png">PNG Sequence</option>
          </select>
          <div class="sidebar-row">
            <button id="btn-render" class="rec-btn" style="flex:1" title="Frame-exact render of one full stage loop (F9)">● Render [F9]</button>
            <button id="btn-snapshot" title="Save current frame as PNG (F8)">📷</button>
            <button id="btn-open-renders" title="Open renders folder">📂</button>
            <button id="btn-open-assets" title="Open assets folder: photos (.jpg/.png) and 3D models (.obj) used by scenes">🖼</button>
          </div>
        </div>

        <div class="sidebar-section" style="margin-top:auto">
          <div class="sidebar-label">STUDIO</div>
          <div class="sidebar-row">
            <button id="btn-code" style="flex:1" title="View or edit live simulation JS">&lt;/&gt; Code</button>
            <button id="btn-ai-settings" class="primary-btn" style="flex:1" title="Configure AI Provider">⚙ AI</button>
          </div>
        </div>
      </aside>

      <!-- Main 60FPS 3D ASCII Viewport + Bottom Prompt Bar -->
      <div id="terminal-column">
        <main id="viewport">
          <canvas id="ascii-canvas"></canvas>
          <div id="render-overlay">
            <div class="render-card">
              <div id="render-title">RENDERING</div>
              <div class="render-track"><div id="render-fill"></div></div>
              <div id="render-detail">0%</div>
              <div class="render-hint">ESC to cancel</div>
            </div>
          </div>
          <div id="toast"></div>
        </main>

        <div id="narration-strip" title="Script line for the current stage (not rendered into exports)"><span id="narration-tag"></span><span id="narration-text"></span></div>

        <!-- Minimal Terminal Prompt Input (Remains usable in Clean View!) -->
        <footer id="prompt-bar">
          <span class="prompt-prefix">&gt;</span>
          <input
            id="prompt-input"
            type="text"
            placeholder="Prompt a visualization (e.g. '3D orchestrator cloning agents' or 'worm attacking core')..."
            autocomplete="off"
            spellcheck="false"
          />
          <button id="btn-generate" class="primary-btn" title="Execute prompt (Enter)">Run</button>
          <button id="btn-generate-autotype" title="Auto-type & execute (Shift+Enter)">🎬</button>
        </footer>
      </div>
    </div>

    <div id="clean-mode-badge">[TAB] Restore | [SPACE / 1-4] Stage | [ [ / ] ] Scene | [F2] Type | [P] Pause | [F8] Snap | [F9] Render</div>

    <!-- AI Settings Modal -->
    <div id="modal-ai" class="modal-backdrop">
      <div class="modal-card">
        <div class="modal-header">
          <span>⚙ AI GENERATION BACKEND</span>
          <button id="btn-close-ai-modal">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-row">
            <label>Active Engine</label>
            <select id="cfg-provider">
              <option value="lmstudio">LM Studio (http://localhost:1234/v1)</option>
              <option value="ollama">Ollama (http://localhost:11434)</option>
              <option value="gemini">Google Gemini API</option>
              <option value="openai">OpenAI API</option>
              <option value="anthropic">Anthropic Claude API</option>
              <option value="offline">Offline 3D Procedural Synthesizer</option>
            </select>
          </div>

          <div id="provider-box-lmstudio" class="provider-box">
            <div class="form-row">
              <label>LM Studio Endpoint</label>
              <div class="form-row-inline">
                <input id="cfg-lmstudio-url" type="text" style="flex:1" value="http://localhost:1234/v1" />
                <button id="btn-detect-lmstudio" class="primary-btn">Detect Model</button>
              </div>
            </div>
            <div class="form-row" style="margin-top:8px">
              <label>Model ID</label>
              <input id="cfg-lmstudio-model" type="text" placeholder="Auto-detects loaded model" />
            </div>
          </div>

          <div id="provider-box-ollama" class="provider-box" style="display:none">
            <div class="form-row">
              <label>Ollama URL</label>
              <div class="form-row-inline">
                <input id="cfg-ollama-url" type="text" style="flex:1" value="http://localhost:11434" />
                <button id="btn-detect-ollama" class="primary-btn">Detect Models</button>
              </div>
            </div>
            <div class="form-row" style="margin-top:8px">
              <label>Model Name</label>
              <input id="cfg-ollama-model" type="text" value="llama3.1" />
            </div>
          </div>

          <div id="provider-box-gemini" class="provider-box" style="display:none">
            <div class="form-row">
              <label>Gemini API Key</label>
              <input id="cfg-gemini-key" type="password" placeholder="AIzaSy..." />
            </div>
            <div class="form-row" style="margin-top:8px">
              <label>Gemini Model</label>
              <input id="cfg-gemini-model" type="text" value="gemini-2.5-flash" />
            </div>
          </div>

          <div id="provider-box-openai" class="provider-box" style="display:none">
            <div class="form-row">
              <label>OpenAI API Key</label>
              <input id="cfg-openai-key" type="password" placeholder="sk-..." />
            </div>
            <div class="form-row" style="margin-top:8px">
              <label>OpenAI Model</label>
              <input id="cfg-openai-model" type="text" value="gpt-4o" />
            </div>
          </div>

          <div id="provider-box-anthropic" class="provider-box" style="display:none">
            <div class="form-row">
              <label>Anthropic API Key</label>
              <input id="cfg-anthropic-key" type="password" placeholder="sk-ant-..." />
            </div>
            <div class="form-row" style="margin-top:8px">
              <label>Anthropic Model</label>
              <input id="cfg-anthropic-model" type="text" value="claude-3-7-sonnet-latest" />
            </div>
          </div>

          <div class="form-row" style="margin-top:4px; border-top:1px solid var(--border-col); padding-top:10px">
            <div class="form-row-inline">
              <label style="flex:1">Typing Speed (ms):</label>
              <input id="cfg-typing-speed" type="number" min="10" max="150" value="34" style="width:70px" />
              <label style="margin-left:12px">Font (px):</label>
              <input id="cfg-font-size" type="number" min="12" max="24" value="16" style="width:65px" />
            </div>
          </div>

          <div id="ai-detect-status" style="font-size:11px; color:var(--text-accent); min-height:16px"></div>
        </div>
        <div class="modal-footer">
          <button id="btn-open-data-folder">📂 Saved Folder</button>
          <button id="btn-save-ai-settings" class="primary-btn">Save</button>
        </div>
      </div>
    </div>

    <!-- Live Script Code Editor Modal -->
    <div id="modal-code" class="modal-backdrop">
      <div class="modal-card" style="width:820px">
        <div class="modal-header">
          <span>&lt;/&gt; SIMULATION CODE EDITOR</span>
          <button id="btn-close-code-modal">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-row-inline">
            <div class="form-row" style="flex:1">
              <label>Scene Title</label>
              <input id="code-sim-title" type="text" />
            </div>
            <div class="form-row" style="flex:1">
              <label>Stages (comma-separated)</label>
              <input id="code-sim-phases" type="text" />
            </div>
          </div>
          <div class="form-row">
            <label>JavaScript (`init(ctx)`, `onPhaseChange(phase, ctx)`, `update(ctx)`)</label>
            <textarea id="code-sim-editor" class="code-editor" spellcheck="false"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button id="btn-delete-saved" class="danger-btn" style="margin-right:auto">Delete</button>
          <button id="btn-apply-code">▶ Apply Live</button>
          <button id="btn-save-code-preset" class="primary-btn">💾 Save Scene</button>
        </div>
      </div>
    </div>
  </div>

  <script src="engine.js?v=20261022b"></script>
  <script src="visuals.js?v=20261022b"></script>
  <script src="presets.js?v=20261022b"></script>
  <script src="library-scenes.js?v=20261022b"></script>
  <script src="ai-generator.js?v=20261022b"></script>
  <script src="app.js?v=20261022b"></script>
</body>
</html>
